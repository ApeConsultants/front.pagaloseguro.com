<div *ngIf="isOpen" class="dialog-backdrop" (click)="onCancel()"></div>

<div *ngIf="isOpen && data" class="dialog-container">
  <h2 class="dialog-title">{{ data.title }}</h2>
  <p class="dialog-message">{{ data.message }}</p>
  
  <div class="dialog-actions" [class.is-alert]="data.type === 'alert'">
    
    <button *ngIf="data.type !== 'alert'" class="btn btn-cancel" (click)="onCancel()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    
    <button class="btn btn-confirm" (click)="onConfirm()">
      {{ data.confirmText || (data.type === 'alert' ? 'Entendido' : 'Aceptar') }}
    </button>
  </div>
</div>

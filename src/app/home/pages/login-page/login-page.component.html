<nav class="login-nav active" [class.open]="menuOpen">
  <a class="nav-logo" [routerLink]="'/'" aria-label="Ir a la página principal">
    <img src="assets/logo/Logo.svg" alt="Págalo Seguro" />
  </a>

  <button
    class="nav-toggle"
    type="button"
    (click)="menuOpen = !menuOpen"
    aria-label="Abrir menú"
    [attr.aria-expanded]="menuOpen">
    <i class="fi fi-sr-menu-burger" aria-hidden="true"></i>
  </button>

  <ul class="nav-list">
    <li><a href="" (click)="$event.preventDefault(); menuOpen=false;">Nosotros</a></li>
    <li><a href="" (click)="$event.preventDefault(); menuOpen=false;">Contáctanos</a></li>
  </ul>

  <div class="nav-slot" aria-hidden="true"></div>
</nav>
<div class="line lineactive"></div>


<main class="login-main">
<div class="login-wrapper">

  <img src="assets/logo/Logo.svg" alt="Págalo Seguro Logo" class="login-logo">

  <div class="login-card">
    
    <h2>Iniciar Sesión</h2>
    <p>Ahorro para tu futuro...</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" formControlName="correo" placeholder="correo@dominio.com">
        <div *ngIf="loginForm.get('correo')?.touched && loginForm.get('correo')?.invalid" class="error-message">
          <span *ngIf="loginForm.get('correo')?.errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="loginForm.get('correo')?.errors?.['email']">Formato de correo inválido.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="Tu contraseña">
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-message">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
</main>
